<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A profile card for Sathish Kumar, UI/UX mobile designer.">
    <title>Profile Card | Sathish Kumar</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page">
      <section class="profile-card" aria-labelledby="profile-name">
        <div class="card-menu" aria-hidden="true">···</div>

        <div class="avatar-wrap">
          <img
            class="avatar"
            src="https://i.pravatar.cc/160?img=12"
            alt="Portrait of Sathish Kumar"
            width="96"
            height="96"
          >
          <span class="online-indicator" role="img" aria-label="Online" style="background-color: #22c55e"></span>
        </div>

        <h1 id="profile-name">That Sosatya</h1>
        <p class="role">UI/UX Mobile Designer</p>

        <ul class="stats" aria-label="Profile statistics">
          <li><span>Projects</span><strong>17</strong></li>
          <li><span>Following</span><strong>159</strong></li>
          <li><span>Followers</span><strong>205</strong></li>
        </ul>

        <p class="bio">
          Lorem ipsum dolor sit amet, consectetur adipisicing elit. Sed et amet
          ut velit omnis ultricies. Ut vitae diam volutpat quisque eget.
        </p>

        <nav class="social-links" aria-label="Social media">
          <a href="https://twitter.com/" aria-label="Twitter">t</a>
          <a href="https://facebook.com/" aria-label="Facebook">f</a>
          <a href="https://instagram.com/" aria-label="Instagram">◎</a>
          <a href="https://dribbble.com/" aria-label="Dribbble">◉</a>
        </nav>

        <a class="profile-button" href="mailto:sathish.kumar@example.com">View Profile</a>
      </section>
    </main>
  </body>
</html>
